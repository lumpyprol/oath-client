# fly.toml app configuration file generated for oath-async on 2026-09-09T22:59:25-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oath-async'
primary_region = 'ewr'

[build]
[env]
  DB_PATH = '/data/games.db'
  NODE_OPTIONS = '--experimental-sqlite'
  PORT = '8080'

# SQLite lives on a volume. Created once via:
#   fly volumes create data --size 1 --region ewr
[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale past one machine: SQLite has a single writer, and the
  # optimistic-concurrency check assumes one process owns the file.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
